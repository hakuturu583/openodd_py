# The default ODD: what a road-vehicle simulator commonly measures, after
# ISO 34503 (scenery, environmental conditions, dynamic elements), and no
# modules -- so every situation is inside it. It says what the runs reached,
# not what a system is built for: write your own ODD for that.
#
# This file is a subset of tier4/taxonomy: each concept here has upstream's id,
# kind, unit and literals, so an ODD or rules written against it read against
# upstream unchanged. Concepts the default ODD measures that upstream lacks yet
# are in pending_upstream.yaml. Rules name this file `taxonomy: {bundled:
# default}`, so their cause nodes are among these concepts.
#
# Some concepts are declared and not measured by the default binding --
# snow and temperature, which a simulator may not bring about: a backend that
# cannot names them (Backend.unsupported), and an ODD that measures or
# restricts them is refused there (docs/python_odd.md).
#
# Upstream's ids are kept as they are, typos included (`oppsing_lanes`,
# `trrafic_flow_rate`, where they appear), so an id matches upstream's
# exactly. One exception: upstream's `fog_level` tells its levels by
# `visibility_range`, which it does not declare (tier4/taxonomy#46); here they
# are told by `fog_visibility_range`, the concept beside it.
TAXONOMY:
  ego_vehicle:
    ego_vehicle:
      velocity: float speed
  environment_conditions:
    environment_conditions:
      temperature: float temperature
      weather:
        rain:
          rainfall_rate: float precipitation_rate
          rain_intensity:
            no_rain:
              rainfall_rate: "< 0.1 mm/h"
            light_rain:
              rainfall_rate: "[0.1 .. 2.5) mm/h"
            moderate_rain:
              rainfall_rate: "[2.5 .. 7.6] mm/h"
            heavy_rain:
              rainfall_rate: "> 7.6 mm/h"
        snow:
          snowfall_rate: float precipitation_rate
          snow_intensity:
            no_snow:
              snowfall_rate: "< 0.1 mm/h"
            light_snow:
              snowfall_rate: "[0.1 .. 5.5] mm/h"
            heavy_snow:
              snowfall_rate: "> 5.5 mm/h"
        wind:
          wind_speed: float speed_km_per_h
          wind_intensity:
            no_wind:
              wind_speed: "< 5 km/h"
            light_wind:
              wind_speed: "[5 .. 20) km/h"
            moderate_wind:
              wind_speed: "[20 .. 50] km/h"
            strong_wind:
              wind_speed: "> 50 km/h"
        fog:
          fog_visibility_range: float length
          fog_level:
            fog_not_detectable:
              fog_visibility_range: "> 1600 m"
            fog_mist:
              fog_visibility_range: "[800 .. 1600] m"
            fog_medium:
              fog_visibility_range: "[450 .. 800) m"
            fog_heavy:
              fog_visibility_range: "[50 .. 450) m"
            fog_thick:
              fog_visibility_range: "< 50 m"
      illumination:
        time_of_day: [day, dusk, night, dawn]
        cloudiness: [clear, partly_cloudy, overcast]
  scenery_elements:
    scenery_elements:
      scenery_element:
        road_infrastructure:
          road_type: [local_road, primary_road, highway]
          speed_limit: float speed_km_per_h
        lane_infrastructure:
          detailed_lane_structure:
            through_lanes:
              lane_count: integer
        zones_and_areas:
          area:
            drivable_area_type: [lane, shoulder, parking_space, mixed_pedestrian_and_vehicular_traffic]
        drivable_area_surface:
          road_surface_condition:
            - dry
            - wet
            - snow_covered
            - black_ice
            - gravel
            - cobblestone
            - standing_water
            - icy
            - puddle
            - fallen_leaves
            - road_heave
            - road_pothole
