# The default ODD: every attribute a road-vehicle simulator commonly measures,
# after ISO 34503 (scenery, environmental conditions, dynamic elements), and no
# modules -- so every situation is inside it. It says what the runs reached,
# not what a system is built for: write your own ODD for that.
#
# Its concepts are moving to tier4/taxonomy's ids and types (the shared
# vocabulary, docs/rules.md "Where the rules stand"); those under `scenery`,
# `environment` and `dynamic` have not moved yet. `openodd-taxonomy-check`
# lists what is left.
TAXONOMY:
  scenery:
    junction: boolean
    location: [urban, nonurban, private]
    road_type: [road, highway, road_shoulder, play_street, parking]
  scenery_elements:
    scenery_elements:
      scenery_element:
        road_infrastructure:
          speed_limit: float speed_km_per_h
        lane_infrastructure:
          detailed_lane_structure:
            through_lanes:
              lane_count: integer
  environment:
    illumination: [day, low_sun, twilight, night]
    rain: [none, light, moderate, heavy]
    fog: [none, light, moderate, heavy]
  ego_vehicle:
    ego_vehicle:
      velocity: float speed
  dynamic:
    traffic_density: [none, low, medium, high]
    pedestrian_nearby: boolean
    vehicle_ahead_gap: float length
    vehicle_ahead_relative_speed: float velocity
    crossing_pedestrian_gap: float length
  dynamic_entities:
    dynamic_entities:
      pedestrian:
        velocity: float speed
