[package]
name = "openodd-editor"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "An editor for ASAM OpenODD YAML in the browser, in Rust and WebAssembly"
license = "Apache-2.0"
repository = "https://github.com/hakuturu583/openodd_py"
publish = false

[dependencies]
# The core without `native`: it checks the document as it is edited, with the
# same reader the Python package uses.
openodd = { path = "../..", default-features = false }
serde_norway = "0.9"
regex = "1"
serde = "1"
indexmap = "2"
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Blob",
  "DomRect",
  "Element",
  "PointerEvent",
  "BlobPropertyBag",
  "File",
  "FileList",
  "HtmlAnchorElement",
  "HtmlElement",
  "Document",
  "HtmlInputElement",
  "HtmlSelectElement",
  "Storage",
  "Url",
  "Window",
] }
console_error_panic_hook = "0.1"
