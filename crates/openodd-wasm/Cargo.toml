[package]
name = "openodd-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "openodd's coverage view, case plot and fuzzy rules view in the browser, through WebAssembly"
license = "Apache-2.0"
repository = "https://github.com/hakuturu583/openodd_py"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The core without `native` (no file locks, no tar): what builds for
# wasm32-unknown-unknown. The flaky model and the case predictor are in it.
openodd = { path = "../..", default-features = false }
openodd-coverage-view = { path = "../openodd-coverage-view" }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = "2"
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"
