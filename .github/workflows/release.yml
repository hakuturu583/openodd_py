# Cuts releases and publishes them to the GitHub release and PyPI. The mechanism is simple_lanelet2's.
#
# There are three ways in, and the first is the everyday one:
#
#   push to main   when a merged PR carries exactly one `release:major|minor|patch`
#                  label, the `release` job bumps the version, tags it `vX.Y.Z`, and the
#                  tag is built and published -- all in this one run.
#   push a v* tag  a hand-cut tag (a hotfix, say) is built and published directly; the
#                  `release` job is skipped.
#   workflow_dispatch   builds the wheels and sdist without tagging or publishing, to
#                  eyeball a release before committing to it. With `publish: true` it
#                  instead tags the dispatched commit with the version in its
#                  Cargo.toml and publishes that: the way to finish a release whose
#                  version was bumped but never tagged.
#
# The publish happens as a follow-up job here rather than in a separate `on: push:
# tags` workflow on purpose: the auto-release tag is pushed with GITHUB_TOKEN, and a
# token-pushed tag does not start new workflow runs.
#
# Every release's wheels and sdist are attached to its GitHub release, whose assets
# page is a find-links index (`uv`/`pip --find-links
# https://github.com/hakuturu583/openodd_py/releases/expanded_assets/<tag>`).
#
# Every release is also published to PyPI with Trusted Publishing, so no token is
# stored here. Configure it once on PyPI: project openodd-py, owner hakuturu583,
# repository openodd_py, workflow release.yml, environment pypi. Until that exists the
# publish job fails, while the GitHub release still carries the files.
#
# A version can never be replaced on PyPI, so the tests run again here rather than
# trusting that CI was green on the same commit.

name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Tag the dispatched commit vX.Y.Z (its Cargo.toml version) and publish it"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Read the release label off the merged PR and, if there is one, bump the version
  # and push the tag. Runs only on a push to main; a tag push or a manual dispatch
  # skips it and falls straight through to the build.
  release:
    name: cut the release tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read   # the commit -> PR lookup below
    # Two release merges close together would both bump the same main and race on the
    # push. Queue them instead: the second checks out main only once the first has
    # pushed its bump, so it bumps from there.
    concurrency:
      group: release-bump
      cancel-in-progress: false
    outputs:
      bump: ${{ steps.pr.outputs.bump }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: read the release label off the merged PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A failed lookup fails the job: swallowing it would read as "no PR" and
          # drop a labelled merge's release without a trace.
          pr_json=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/pulls \
            --jq '.[0] // empty')
          if [ -z "$pr_json" ]; then
            echo "No PR associated with this push -- nothing to release"
            echo "bump=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          labels=$(echo "$pr_json" | jq -r '[.labels[].name] | join(",")')
          bump=none
          count=0
          for lvl in major minor patch; do
            if echo ",$labels," | grep -q ",release:${lvl},"; then
              bump=$lvl
              count=$((count + 1))
            fi
          done
          if [ "$count" -gt 1 ]; then
            echo "::error::More than one release label on the PR -- pick exactly one"
            exit 1
          fi
          echo "bump=${bump}" >> "$GITHUB_OUTPUT"
          echo "Resolved bump level: ${bump}"

      - uses: actions/checkout@v4
        if: steps.pr.outputs.bump != 'none'
        with:
          ref: main
          fetch-depth: 0

      - name: bump Cargo.toml and Cargo.lock together
        if: steps.pr.outputs.bump != 'none'
        id: bump
        run: |
          set -euo pipefail
          next=$(python3 tools/bump_version.py "${{ steps.pr.outputs.bump }}")
          echo "next=${next}" >> "$GITHUB_OUTPUT"
          echo "tag=v${next}" >> "$GITHUB_OUTPUT"
          echo "Bumped to ${next} (${{ steps.pr.outputs.bump }})"

      - name: fail if the tag already exists
        if: steps.pr.outputs.bump != 'none'
        run: |
          if git rev-parse "refs/tags/${{ steps.bump.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.bump.outputs.tag }} already exists" >&2
            exit 1
          fi

      - name: commit, tag and push
        if: steps.pr.outputs.bump != 'none'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): ${{ steps.bump.outputs.tag }}"
          git tag -a "${{ steps.bump.outputs.tag }}" -m "Release ${{ steps.bump.outputs.tag }}"
          # One push for both: if either is refused, neither lands, and a re-run
          # starts over from the same main instead of bumping it again.
          git push --atomic origin "HEAD:main" "${{ steps.bump.outputs.tag }}"

  # A dispatch with `publish: true`: tag the dispatched commit with the version its
  # Cargo.toml already says, so a bump that reached main without its tag can still be
  # published. A tag already on that commit is reused; one elsewhere is refused.
  tag:
    name: tag the dispatched version
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: t
        run: |
          set -euo pipefail
          tag="v$(python3 tools/bump_version.py --current)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            if [ "$(git rev-list -n 1 "$tag")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::Tag $tag already exists on another commit" >&2
              exit 1
            fi
            echo "Tag $tag is already on this commit; publishing it"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"

  # One place to work out, for all three entry points, which commit to build and whether
  # it may be published. Runs even when `release` is skipped (tag push, dispatch).
  resolve:
    name: resolve what to build
    needs: [release, tag]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.r.outputs.proceed }}
      ref: ${{ steps.r.outputs.ref }}
      publish: ${{ steps.r.outputs.publish }}
      version: ${{ steps.r.outputs.version }}
    steps:
      - id: r
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          BUMP: ${{ needs.release.outputs.bump }}
          TAG: ${{ needs.release.outputs.tag }}
          DISPATCH_TAG: ${{ needs.tag.outputs.tag }}
          DISPATCH_TAGGED: ${{ needs.tag.result }}
        run: |
          set -euo pipefail
          proceed=false; publish=false; ref="$REF_NAME"
          if [ "$EVENT" = "push" ] && [[ "$REF" == refs/tags/v* ]]; then
            # A hand-cut tag: build and publish it.
            proceed=true; publish=true; ref="$REF_NAME"
          elif [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            # The auto-release path: build and publish only if a tag was cut.
            if [ "$BUMP" != "none" ] && [ -n "$TAG" ]; then
              proceed=true; publish=true; ref="$TAG"
            fi
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$DISPATCH_TAGGED" != "skipped" ]; then
            # A dispatch that publishes: only once its tag is there.
            if [ "$DISPATCH_TAGGED" = "success" ] && [ -n "$DISPATCH_TAG" ]; then
              proceed=true; publish=true; ref="$DISPATCH_TAG"
            fi
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            # A dry run: build the artifacts, publish nothing.
            proceed=true; publish=false; ref="$REF_NAME"
          fi
          version=""
          if [ "$publish" = true ]; then version="${ref#v}"; fi
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "event=$EVENT ref=$ref proceed=$proceed publish=$publish version=$version"

  verify:
    name: test the tagged commit
    needs: [resolve]
    # `release` is skipped on a tag push or a dispatch, and a skipped ancestor skips
    # every job downstream unless its condition says otherwise -- hence `!cancelled()`.
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.resolve.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      # pyproject.toml declares the version dynamic, so Cargo.toml is the one source;
      # the lock file must agree with it or `cargo --locked` fails downstream.
      - name: the version in the tag must be the version in the package
        if: needs.resolve.outputs.publish == 'true'
        env:
          TAG: ${{ needs.resolve.outputs.version }}
        run: |
          CRATE=$(python3 tools/bump_version.py --current)
          echo "tag=$TAG cargo=$CRATE"
          test "$TAG" = "$CRATE"
          cargo metadata --locked --format-version 1 --no-deps > /dev/null

      - run: cargo test --locked --workspace
      - run: uv venv && uv pip install maturin pytest hypothesis pyyaml
      - run: uv run --no-project maturin develop
      - run: uv run --no-project pytest -q

  # The same tests on Windows, which the Linux job cannot speak for.
  verify-windows:
    name: test the tagged commit (windows)
    needs: [resolve]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.resolve.outputs.proceed == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: cargo test --locked --workspace
      - run: uv venv && uv pip install maturin pytest hypothesis pyyaml
      - run: uv run --no-project maturin develop
      - run: uv run --no-project pytest -q

  wheels:
    name: wheel (${{ matrix.os }} ${{ matrix.target }})
    needs: [resolve, verify, verify-windows]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.verify-windows.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        # Every target on a runner of its own architecture, so the wheel that is
        # uploaded is also the wheel that is tested below.
        include:
          - { os: linux, runner: ubuntu-latest, target: x86_64 }
          - { os: linux, runner: ubuntu-24.04-arm, target: aarch64 }
          - { os: macos, runner: macos-latest, target: universal2-apple-darwin }
          - { os: windows, runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      # abi3-py310, so one wheel per platform serves every Python 3.10+.
      # `manylinux` is ignored on macOS and Windows.
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      # The artifact itself, installed clean and run against the tests -- not a
      # rebuild of the same sources.
      - uses: astral-sh/setup-uv@v6
      - name: test the wheel that is about to be published
        shell: bash
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/fresh"
          uv pip install --python "$RUNNER_TEMP/fresh" dist/*.whl pytest hypothesis pyyaml
          PY="$RUNNER_TEMP/fresh/bin/python"
          [ -x "$PY" ] || PY="$RUNNER_TEMP/fresh/Scripts/python"
          # Run from a directory without python/openodd, so the installed wheel is
          # what gets imported.
          cp -r tests "$RUNNER_TEMP/tests"
          cd "$RUNNER_TEMP" && "$PY" -m pytest tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    name: sdist
    needs: [resolve, verify]
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  # The GitHub release, created for an auto-cut and a hand-cut tag alike, once the
  # wheels have passed -- so a release page never exists without its files.
  github-release:
    name: GitHub release with the wheels attached
    needs: [resolve, wheels, sdist]
    if: ${{ !cancelled() && needs.wheels.result == 'success' && needs.sdist.result == 'success' && needs.resolve.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.ref }}
          files: dist/*
          generate_release_notes: true

  publish:
    name: publish to PyPI
    needs: [resolve, wheels, sdist]
    if: ${{ !cancelled() && needs.wheels.result == 'success' && needs.sdist.result == 'success' && needs.resolve.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/openodd-py
    permissions:
      id-token: write   # Trusted Publishing; no token in secrets.
    steps:
      # Named explicitly rather than "everything in the run", so nothing else a later
      # job uploads can end up in dist/.
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - run: ls -l dist

      # PyPI rejects bad metadata only after the build and the OIDC exchange; failing
      # here costs nothing.
      - name: check the metadata before uploading
        run: pipx run twine check --strict dist/*

      # PyPI refuses to replace a file but accepts new ones for an existing release,
      # so skipping what is already there lets a re-run add what an earlier attempt
      # failed to upload.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
