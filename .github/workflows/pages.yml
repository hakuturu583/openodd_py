# The demo site, on GitHub Pages: the ODD editor (crates/openodd-editor) at the
# root, and the coverage viewer (examples/wasm-viewer) under viewer/. Both run
# entirely in the browser, on openodd's core compiled to WebAssembly.
#
# Pages must be set to deploy from GitHub Actions once (Settings -> Pages ->
# Build and deployment -> Source: GitHub Actions).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk,wasm-pack
      - name: Build the editor
        working-directory: crates/openodd-editor
        run: trunk build --release --cargo-profile wasm-release
      - name: Build the coverage viewer
        run: |
          examples/wasm-viewer/build.sh
          mkdir -p site
          cp -r crates/openodd-editor/dist/. site/
          mkdir -p site/viewer
          cp -r examples/wasm-viewer/index.html examples/wasm-viewer/*.json examples/wasm-viewer/pkg site/viewer/
          rm -f site/viewer/pkg/.gitignore
          ls -lR site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
