[package]
name = "openodd"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "ASAM OpenODD 1.0: read, evaluate, version and sample Operational Design Domains"
license = "Apache-2.0"
repository = "https://github.com/hakuturu583/openodd_py"
readme = "README.md"

[lib]
name = "openodd"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_norway = "0.9"
indexmap = { version = "2", features = ["serde"] }
regex = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
tar = "0.4"
flate2 = "1"
rand = "0.8"
rand_chacha = "0.3"
fs2 = "0.4"
pyo3 = { version = "0.25", features = ["abi3-py310", "extension-module", "indexmap"], optional = true }

[dev-dependencies]
tempfile = "3"
